version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: thinkit
      POSTGRES_USER: thinkit
      POSTGRES_PASSWORD: thinkit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ./apps/api
    command: uv run manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    env_file:
      - ./apps/api/.env
    environment:
      - DATABASE_URL=postgres://thinkit:thinkit@postgres:5432/thinkit
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - MINIO_ENDPOINT=http://16.170.201.95:9000
      - R2_ENDPOINT_URL=http://minio:9000
    depends_on:
      - postgres
      - redis
      - minio

  celery:
    build:
      context: ./apps/api
    command: uv run celery -A config worker -l info --pool=solo
    env_file:
      - ./apps/api/.env
    environment:
      - DATABASE_URL=postgres://thinkit:thinkit@postgres:5432/thinkit
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - MINIO_ENDPOINT=http://16.170.201.95:9000
      - R2_ENDPOINT_URL=http://minio:9000
    depends_on:
      - api
      - redis
      - postgres

  web:
    build:
      context: ./apps/web
      args:
        - NEXT_PUBLIC_API_URL=http://16.170.201.95:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  minio_data:
